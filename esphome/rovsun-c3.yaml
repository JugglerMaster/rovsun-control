# Rovsun / Tuya mini-split control via Seeed XIAO ESP32-C3
#
# Replaces the RT9720CF (Tuya RTL8720CF) Wi-Fi module and speaks the Tuya
# MCU serial protocol to the mini-split's main control board.
#
# Pinout (XIAO ESP32-C3):
#   D7  GPIO20  -> main-MCU RX   (XIAO TX)
#   D6  GPIO21  -> main-MCU TX   (XIAO RX)
#   GND         -> board GND
#   3V3 or 5V   -> board module-power rail (measure first!)
#
# The `tuya:` component implements the 0x55 AA framing. You only have to map
# the datapoints (DPs) you discovered with `tinytuya` in Phase 1.
#
# Common mini-split DP layout (VERIFY with your get_status() dump):
#   1  : power            (bool)
#   2  : mode             (enum: 0 auto,1 cool,2 dry,3 fan,4 heat)
#   16 : target temp      (int, often 0.1 deg units or raw C)
#   17 : current temp     (int, sensor)
#   18 : fan speed        (enum: 0 auto,1 low,2 mid,3 high)
#   19 : swing            (bool/enum)
#   20+ : aux heat / sleep / eco / display (device specific)
#
# Flash: esptool or `esphome run rovsun-c3.yaml` (USB-C).

esphome:
  name: rovsun-c3
  friendly_name: Rovsun Mini-Split

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

# XIAO C3 has a native USB CDC serial; enable it so logs work over USB-C.
logger:
  baud_rate: 0   # use native USB, not the UART pins

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "rovsun-c3-fallback"
    password: !secret ap_password

captive_portal:

# UART to the main control MCU. Confirm baud with the sniff sketch first.
uart:
  id: tuya_uart
  tx_pin: GPIO20
  rx_pin: GPIO21
  baud_rate: 9600      # Tuya MCU default; change if your sniff shows otherwise
  parity: NONE
  stop_bits: 1

tuya:
  uart_id: tuya_uart
  # Tuya MCU sends a heartbeat; ESPHome answers automatically.

climate:
  - platform: tuya
    name: "Mini Split"
    switch_datapoint: 1
    target_temperature_datapoint: 16
    current_temperature_datapoint: 17
    mode_datapoint: 2
    mode_state_to_enum:
      0: auto
      1: cool
      2: dry
      3: fan_only
      4: heat
    fan_mode_datapoint: 18
    fan_mode_state_to_enum:
      0: auto
      1: low
      2: medium
      3: high
    # swing_datapoint: 19     # uncomment once confirmed
    # supports_away: false

# Optional: expose raw DP values as sensors once you confirm their meaning.
# sensor:
#   - platform: tuya
#     name: "MCU Temp"
#     datapoint: 17
