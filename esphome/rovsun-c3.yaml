# Rovsun mini-split control via Seeed XIAO ESP32-C6
#
# Replaces the stock Tuya Wi-Fi module. The mini-split speaks a CUSTOM `A5`
# UART protocol (NOT Tuya 55 AA), implemented by the local `rovsun_a5`
# external component. The XIAO is 3.3 V logic, so it connects to the mini-split
# through the 3.3 V/5 V level shifter:
#
#   XIAO (3.3 V)  <->  Level shifter (LV)  |  Level shifter (HV)  <->  Mini-split (5 V)
#   D7  GPIO22 (TX) -> LV-TX in            |  HV-TX out          -> main-board RX (idle pin)
#   D6  GPIO21 (RX) <- LV-RX out           |  HV-RX in           <- main-board TX (streaming pin)
#   GND            <-> LV-GND              |  HV-GND             <-> board GND
#   3V3            -> LV rail              |  HV rail            -> board 5V (NOT XIAO 5V/VCC)
#
# Do NOT connect XIAO 5V/VCC to the shifter HV rail; power the HV side from the
# mini-split's own 5 V rail. Confirmed working commands (Pro Micro bench test):
#   power  0x0001, beep 0x0025, fan 0x0005, vertical 0x0011, mode 0x0012,
#   setpoint 0x0002 (hundredths of deg C).
#
# FINDING THE UART INTERFACE: the "UART interface" for this device is the mini-split
# main board's 5 V TTL serial on the 4-pin JST (main-board TX continuously streams
# `A5` frames; its RX is idle until a command is sent). Those 5 V lines must be
# level-shifted down to the XIAO's 3.3 V before connecting. The exact XIAO GPIOs
# you wire to depend on which physical pads you soldered AND your board's
# D-pad->GPIO mapping:
#   - Seeed XIAO ESP32-C3: D6=GPIO21, D7=GPIO20
#   - Seeed XIAO ESP32-C6: D6=GPIO21, D7=GPIO22   <-- this config
# Set `tx_pin`/`rx_pin` (under `uart:` below) to match the pads you actually used.
# If the board won't talk to the AC, re-check the mapping against your board's
# pinout and the `uart:` section -- a wrong GPIO is the usual cause.
#
# Flash: `esphome run rovsun-c3.yaml` (USB-C). Secrets live in esphome/secrets.yaml.

esphome:
  name: rovsun-c3
  friendly_name: Rovsun Mini-Split

esp32:
  board: seeed_xiao_esp32c6
  framework:
    type: esp-idf

# XIAO has native USB (CDC); use it for logs instead of the UART pins.
logger:
  baud_rate: 0

external_components:
  - source:
      type: git
      url: https://github.com/JugglerMaster/rovsun-control
      ref: c3651df3b83329428235364d3ffac2e401277fbd
      path: esphome/components

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "rovsun-c3-fallback"
    password: !secret ap_password

captive_portal:

uart:
  id: ac_uart
  tx_pin: GPIO22
  rx_pin: GPIO21
  baud_rate: 115200
  parity: NONE
  stop_bits: 1

# Entities are defined here (so Home Assistant sees friendly controls) and
# forwarded to the A5 controller. The controller publishes state back onto
# these same entities from the mini-split's reports.
switch:
  - platform: template
    name: "Beep"
    id: beep_switch
    optimistic: true
    on_turn_on:
      - lambda: 'id(rovsun).control_beep(true);'
    on_turn_off:
      - lambda: 'id(rovsun).control_beep(false);'
  - platform: template
    name: "Light"
    id: light_switch
    optimistic: true
    on_turn_on:
      - lambda: 'id(rovsun).control_light(true);'
    on_turn_off:
      - lambda: 'id(rovsun).control_light(false);'
  - platform: template
    name: "Drying"
    id: drying_switch
    optimistic: true
    on_turn_on:
      - lambda: 'id(rovsun).control_drying(true);'
    on_turn_off:
      - lambda: 'id(rovsun).control_drying(false);'

select:
  - platform: template
    name: "Eco"
    id: eco_select
    options:
      - "off"
      - "on"
    set_action:
      - lambda: |
            uint8_t v = (x == "on") ? 1 : 0;
            id(rovsun).control_eco(v);
  - platform: template
    name: "Sleep Mode"
    id: sleep_select
    options:
      - "off"
      - standard
      - aged
      - child
    set_action:
      - lambda: |
            uint8_t v = 0;
            if (x == "standard") v = 1;
            else if (x == "aged") v = 2;
            else if (x == "child") v = 3;
            id(rovsun).control_sleep(v);
  - platform: template
    name: "Generator Mode"
    id: generator_select
    options:
      - lv1
      - lv2
      - lv3
    set_action:
      - lambda: |
            uint8_t v = 1;
            if (x == "lv2") v = 2;
            else if (x == "lv3") v = 3;
            id(rovsun).control_generator(v);
  - platform: template
    name: "Left-Right Direction"
    id: lrdir_select
    options:
      - left_right_flow
      - left_flow
      - middle_flow
      - right_flow
      - left_fix
      - a_bit_left_fix
      - middle_fix
      - a_bit_right_fix
    set_action:
      - lambda: |
            uint8_t v = 0x0D;
            if (x == "left_flow") v = 2;
            else if (x == "middle_flow") v = 3;
            else if (x == "right_flow") v = 4;
            else if (x == "left_fix") v = 9;
            else if (x == "a_bit_left_fix") v = 0x0A;
            else if (x == "middle_fix") v = 0x0B;
            else if (x == "a_bit_right_fix") v = 0x0C;
            id(rovsun).control_lrdir(v);
  - platform: template
    name: "Vertical Direction"
    id: vdir_select
    options:
      - flow
      - up
      - down
      - up_fix
      - above_fix
      - middle_fix
      - above_down_fix
      - down_fix
    set_action:
      - lambda: |
            uint8_t v = 1;
            if (x == "up") v = 2;
            else if (x == "down") v = 3;
            else if (x == "up_fix") v = 9;
            else if (x == "above_fix") v = 0x0A;
            else if (x == "middle_fix") v = 0x0B;
            else if (x == "above_down_fix") v = 0x0C;
            else if (x == "down_fix") v = 0x0D;
            id(rovsun).control_vdir(v);

climate:
  - platform: rovsun_a5
    name: "Rovsun Mini-Split"
    rovsun_a5_id: rovsun

rovsun_a5:
  id: rovsun
  uart_id: ac_uart
  beep: beep_switch
  light: light_switch
  drying: drying_switch
  eco: eco_select
  sleep: sleep_select
  generator: generator_select
  left_right_direction: lrdir_select
  vertical_direction: vdir_select
  log_raw: false
  restore_on_power_on: true
