# Rovsun mini-split control via Seeed XIAO ESP32-C6
#
# Replaces the stock Tuya Wi-Fi module. The mini-split speaks a CUSTOM `A5`
# UART protocol (NOT Tuya 55 AA), implemented by the local `rovsun_a5`
# external component. The XIAO uses 3.3 V logic and connects to the mini-split
# through a 3.3 V/5 V level shifter:
#
#   XIAO (3.3 V)  <->  Level shifter (LV)  |  Level shifter (HV)  <->  Mini-split (5 V)
#   GPIO16 (TX)   -> LV-TX in             |  HV-TX out          -> main-board RX (idle pin)
#   GPIO17 (RX)   <- LV-RX out            |  HV-RX in           <- main-board TX (streaming pin)
#   GND            <-> LV-GND              |  HV-GND             <-> board GND
#   3V3            -> LV rail              |  HV rail            -> board 5V (NOT XIAO 5V/VCC)
#
# Do NOT connect XIAO 5V/VCC to the shifter HV rail; power the HV side from the
# mini-split's own 5 V rail. Confirmed command registers include:
#   power  0x0001, beep 0x0025, fan 0x0005, vertical 0x0011, mode 0x0012,
#   setpoint 0x0002 (hundredths of deg C).
#
# The mini-split's 4-pin JST carries 5 V TTL UART: the main-board TX line
# continuously streams `A5` frames, while its RX line is idle until a command
# is sent. Level-shift both signal lines before connecting them to the XIAO.
#
# Flash with `esphome run rovsun-c3.yaml` (USB-C or OTA). Secrets live in the
# ESPHome secrets file.
# BUILDTEST-123

esphome:
  name: rovsun-downstairs
  friendly_name: Rovsun Mini-Split Downstairs

esp32:
  board: seeed_xiao_esp32c6
  framework:
    type: esp-idf

# XIAO has native USB (CDC); use it for logs instead of the UART pins.
logger:
  baud_rate: 0

# Load the custom A5 component from the local checkout (deployed into
# /config/components by tools/deploy-esphome.sh). Comment this out and switch
# to the upstream git source below to track the published component instead.
external_components:
  - source:
      type: git
      url: https://github.com/JugglerMaster/rovsun-control
      ref: main
      path: esphome/components
    refresh: 0s # refresh on each configuration run
#  - source:
#      type: local
#      path: components

api:
  encryption:
    key: !secret rovsun_c3__api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: rovsun-c3-fallback
    password: !secret rovsun_downstairs__ap_key

captive_portal:

uart:
  id: ac_uart
  tx_pin: GPIO16
  rx_pin: GPIO17
  baud_rate: 115200
  parity: NONE
  stop_bits: 1

# Entities are defined here (so Home Assistant sees friendly controls) and
# forwarded to the A5 controller. The controller publishes state back onto
# these same entities from the mini-split's reports.
switch:
  - platform: template
    name: "Beep"
    id: beep_switch
    optimistic: true
    on_turn_on:
      - lambda: 'id(rovsun).control_beep(true);'
    on_turn_off:
      - lambda: 'id(rovsun).control_beep(false);'
  - platform: template
    name: "Light"
    id: light_switch
    optimistic: true
    on_turn_on:
      - lambda: 'id(rovsun).control_light(true);'
    on_turn_off:
      - lambda: 'id(rovsun).control_light(false);'
  - platform: template
    name: "Drying"
    id: drying_switch
    optimistic: true
    on_turn_on:
      - lambda: 'id(rovsun).control_drying(true);'
    on_turn_off:
      - lambda: 'id(rovsun).control_drying(false);'
  - platform: template
    name: "Eco"
    id: eco_switch
    optimistic: true
    on_turn_on:
      - lambda: 'id(rovsun).control_eco(1);'
    on_turn_off:
      - lambda: 'id(rovsun).control_eco(0);'
  - platform: template
    name: "Power"
    id: power_switch
    optimistic: true
    on_turn_on:
      - lambda: 'id(rovsun).control_power(true);'
    on_turn_off:
      - lambda: 'id(rovsun).control_power(false);'
  - platform: template
    name: "Debug Log"
    id: debug_switch
    optimistic: true
    on_turn_on:
      - lambda: 'id(rovsun).set_log_raw(true);'
    on_turn_off:
      - lambda: 'id(rovsun).set_log_raw(false);'

button:
  - platform: template
    name: "Refresh Status"
    id: refresh_status_button
    on_press:
      - lambda: 'id(rovsun).request_status_();'
  - platform: template
    name: "Temp +"
    id: temp_up_button
    on_press:
      - lambda: 'id(rovsun).nudge_setpoint(1);'
  - platform: template
    name: "Temp -"
    id: temp_down_button
    on_press:
      - lambda: 'id(rovsun).nudge_setpoint(-1);'

select:
  - platform: template
    name: "Sleep Mode"
    id: sleep_select
    options:
      - "off"
      - standard
      - aged
      - child
    set_action:
      - lambda: |
            uint8_t v = 0;
            if (x == "standard") v = 1;
            else if (x == "aged") v = 2;
            else if (x == "child") v = 3;
            id(rovsun).control_sleep(v);
  - platform: template
    name: "Generator Mode"
    id: generator_select
    optimistic: true
    options:
      - "off"
      - lv1
      - lv2
      - lv3
    set_action:
      - lambda: |
            uint8_t v = 0;
            if (x == "lv1") v = 1;
            if (x == "lv2") v = 2;
            else if (x == "lv3") v = 3;
            id(rovsun).control_generator(v);
  - platform: template
    name: "Left-Right Direction"
    id: lrdir_select
    optimistic: true
    options:
      - left_right_flow
      - left_flow
      - middle_flow
      - right_flow
      - left_fix
      - a_bit_left_fix
      - middle_fix
      - a_bit_right_fix
      - right_fix
    set_action:
      - lambda: |
            uint8_t v = 0x0D;
            if (x == "left_right_flow") v = 1;  // confirmed via capture
            else if (x == "left_flow") v = 2;
            else if (x == "middle_flow") v = 3;
            else if (x == "right_flow") v = 4;
            else if (x == "left_fix") v = 9;
            else if (x == "a_bit_left_fix") v = 0x0A;
            else if (x == "middle_fix") v = 0x0B;
            else if (x == "a_bit_right_fix") v = 0x0C;
            else if (x == "right_fix") v = 0x0D;
            id(rovsun).control_lrdir(v);
  - platform: template
    name: "Vertical Direction"
    id: vdir_select
    options:
      - up_fix
      - above_fix
      - middle_fix
      - above_down_fix
      - down_fix
    set_action:
      - lambda: |
            uint8_t v = 0x0B;  // default middle_fix
            if (x == "up_fix") v = 9;
            else if (x == "above_fix") v = 0x0A;
            else if (x == "middle_fix") v = 0x0B;
            else if (x == "above_down_fix") v = 0x0C;
            else if (x == "down_fix") v = 0x0D;
            id(rovsun).control_vdir(v);
  - platform: template
    name: "Fan"
    id: fan_select
    options:
      - auto
      - mute
      - low_wind
      - mid_low_wind
      - mid_wind
      - mid_high_wind
      - high_wind
      - turbo
    set_action:
      - lambda: |
            uint8_t v = 0;
            if (x == "mute") v = 1;
            else if (x == "low_wind") v = 2;
            else if (x == "mid_low_wind") v = 3;
            else if (x == "mid_wind") v = 4;
            else if (x == "mid_high_wind") v = 5;
            else if (x == "high_wind") v = 6;
            else if (x == "turbo") v = 7;
            id(rovsun).control_fan(v);
  - platform: template
    name: "Mode"
    id: mode_select
    options:
      - auto
      - cool
      - dry
      - fan_only
      - heat
    set_action:
      - lambda: |
            uint8_t v = 0;
            if (x == "cool") v = 1;
            else if (x == "dry") v = 2;
            else if (x == "fan_only") v = 3;
            else if (x == "heat") v = 4;
            id(rovsun).control_mode(v);

number:
  - platform: template
    name: "Horizontal Raw Code (temporary)"
    id: horizontal_raw_code
    entity_category: config
    min_value: 0
    max_value: 255
    step: 1
    mode: box
    optimistic: true
    set_action:
      - lambda: 'id(rovsun).control_lrdir((uint8_t)x);'
  - platform: template
    name: "Target Temperature"
    id: setpoint_number
    min_value: 60
    max_value: 90
    step: 1
    mode: box
    unit_of_measurement: "F"
    # Input is degrees Fahrenheit; convert to Celsius for the AC protocol.
    set_action:
      - lambda: 'id(rovsun).control_setpoint((x - 32.0f) * 5.0f / 9.0f);'

sensor:
  - platform: template
    name: "Current Temperature"
    id: current_temp_sensor
    unit_of_measurement: "F"
    device_class: temperature
    state_class: measurement
    # Value is published by the controller from register 0x0003 (hundredths of deg C).

  # --- Reverse-engineering watchers ---------------------------------------
  # These route every other AC-reported register to a sensor so they can be
  # correlated with unit actions. Disabled by default to keep the dashboard
  # clean; enable any of them in HA to start logging its history. All values
  # are the raw register contents (0x0227 is a 4-byte register; the rest are
  # 1-byte unless noted). Meanings are still unknown (see README).
  - platform: template
    name: "Raw 0x000C"
    id: raw_0x000c
    entity_category: diagnostic
    disabled_by_default: true
  - platform: template
    name: "Raw 0x0015"
    id: raw_0x0015
    entity_category: diagnostic
    disabled_by_default: true
  - platform: template
    name: "Raw 0x0017"
    id: raw_0x0017
    entity_category: diagnostic
    disabled_by_default: true
  - platform: template
    name: "Raw 0x0035"
    id: raw_0x0035
    entity_category: diagnostic
    disabled_by_default: true
  - platform: template
    name: "Raw 0x0038"
    id: raw_0x0038
    entity_category: diagnostic
    disabled_by_default: true
  - platform: template
    name: "Raw 0x0055"
    id: raw_0x0055
    entity_category: diagnostic
    disabled_by_default: true
  - platform: template
    name: "Raw 0x005C"
    id: raw_0x005c
    entity_category: diagnostic
    disabled_by_default: true
  - platform: template
    name: "Raw 0x005E"
    id: raw_0x005e
    entity_category: diagnostic
    disabled_by_default: true
  - platform: template
    name: "Raw 0x0072"
    id: raw_0x0072
    entity_category: diagnostic
    disabled_by_default: true
  - platform: template
    name: "Raw 0x0073"
    id: raw_0x0073
    entity_category: diagnostic
    disabled_by_default: true
  - platform: template
    name: "Raw 0x0074"
    id: raw_0x0074
    entity_category: diagnostic
    disabled_by_default: true
  - platform: template
    name: "Raw 0x0095"
    id: raw_0x0095
    entity_category: diagnostic
    disabled_by_default: true
  - platform: template
    name: "Raw 0x00C9"
    id: raw_0x00c9
    entity_category: diagnostic
    disabled_by_default: true
  - platform: template
    name: "Raw 0x00DF"
    id: raw_0x00df
    entity_category: diagnostic
    disabled_by_default: true
  - platform: template
    name: "Raw 0x0148"
    id: raw_0x0148
    entity_category: diagnostic
    disabled_by_default: true
  - platform: template
    name: "Raw 0x0227"
    id: raw_0x0227
    entity_category: diagnostic
    disabled_by_default: true


rovsun_a5:
  id: rovsun
  uart_id: ac_uart
  power: power_switch
  beep: beep_switch
  light: light_switch
  drying: drying_switch
  eco: eco_switch
  sleep: sleep_select
  generator: generator_select
  left_right_direction: lrdir_select
  vertical_direction: vdir_select
  fan: fan_select
  mode: mode_select
  setpoint: setpoint_number
  current_temp: current_temp_sensor
  debug: debug_switch
  log_raw: true
  restore_on_power_on: true
  raw_registers:
    - register: 0x000C
      id: raw_0x000c
    - register: 0x0015
      id: raw_0x0015
    - register: 0x0017
      id: raw_0x0017
    - register: 0x0035
      id: raw_0x0035
    - register: 0x0038
      id: raw_0x0038
    - register: 0x0055
      id: raw_0x0055
    - register: 0x005C
      id: raw_0x005c
    - register: 0x005E
      id: raw_0x005e
    - register: 0x0072
      id: raw_0x0072
    - register: 0x0073
      id: raw_0x0073
    - register: 0x0074
      id: raw_0x0074
    - register: 0x0095
      id: raw_0x0095
    - register: 0x00C9
      id: raw_0x00c9
    - register: 0x00DF
      id: raw_0x00df
    - register: 0x0148
      id: raw_0x0148
    - register: 0x0227
      id: raw_0x0227
