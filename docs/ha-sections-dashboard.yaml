# Home Assistant "sections" view dashboard for the Rovsun mini-splits.
# Two cards: one for the upstairs unit, one for the downstairs unit.
# Each card mirrors the original layout: a "Controls" sub-group plus a
# "Temp Change" sub-group (temp buttons + target temp + mode + current-temp
# graph, which spans the full 2-column width).
#
# Entity IDs follow the regenerated names:
#   upstairs   -> kitchen_..._upstairs_*
#   downstairs -> basement_rec_/office_..._downstairs_*

view_type: sections
sections:
  - type: grid
    cards:
      - type: heading
        heading_style: title
        heading: Mini-Split Upstairs
      - type: heading
        heading_style: subtitle
        heading: Controls
      - type: grid
        square: false
        columns: 2
        cards:
          - type: tile
            entity: switch.kitchen_rovsun_mini_split_upstairs_power
            name:
              type: entity
            vertical: false
            features_position: bottom
          - type: tile
            entity: switch.kitchen_rovsun_mini_split_upstairs_beep
            name:
              type: entity
            vertical: false
            features_position: bottom
          - type: tile
            entity: switch.kitchen_rovsun_mini_split_upstairs_light
            name:
              type: entity
            vertical: false
            features_position: bottom
          - type: tile
            entity: select.kitchen_rovsun_mini_split_upstairs_fan
            name:
              type: entity
            vertical: false
            features_position: inline
            features:
              - type: select-options
          - type: tile
            entity: select.kitchen_rovsun_mini_split_upstairs_left_right_direction
            name:
              type: entity
            vertical: false
            features_position: inline
            features:
              - type: select-options
          - type: tile
            entity: select.kitchen_rovsun_mini_split_upstairs_vertical_direction
            name:
              type: entity
            vertical: false
            features_position: inline
            features:
              - type: select-options
          - type: tile
            entity: switch.kitchen_rovsun_mini_split_upstairs_eco
            name:
              type: entity
            vertical: false
          - type: tile
            entity: select.kitchen_rovsun_mini_split_upstairs_generator_mode
            name:
              type: entity
            vertical: false
            features_position: inline
            features:
              - type: select-options
          - type: tile
            entity: switch.kitchen_rovsun_mini_split_upstairs_drying
            name:
              type: entity
            vertical: false
            features_position: bottom
          - type: tile
            entity: select.kitchen_rovsun_mini_split_upstairs_sleep_mode
            name:
              type: entity
            vertical: false
            features_position: inline
            features:
              - type: select-options
      - type: heading
        heading_style: subtitle
        heading: Temp Change
      - type: vertical-stack
        cards:
          - type: grid
            square: false
            columns: 2
            cards:
              - type: tile
                entity: button.kitchen_rovsun_mini_split_upstairs_temp_2
                name: Temp Decrease -
                icon: mdi:thermometer-minus
                vertical: false
                features_position: bottom
              - type: tile
                entity: button.kitchen_rovsun_mini_split_upstairs_temp
                name: Temp Increase +
                icon: mdi:thermometer-plus
                vertical: false
                features_position: bottom
              - type: tile
                entity: number.kitchen_rovsun_mini_split_upstairs_target_temperature
                name:
                  type: entity
                vertical: false
                features_position: bottom
              - type: tile
                entity: select.kitchen_rovsun_mini_split_upstairs_mode
                name:
                  type: entity
                vertical: false
                features_position: inline
                features:
                  - type: select-options
          - type: statistics-graph
            entities:
              - sensor.kitchen_rovsun_mini_split_upstairs_current_temperature
            title: Current Temp
            days_to_show: 1
            period: 5minute
            chart_type: line-stack
            stat_types:
              - min
            hide_legend: true
            min_y_axis: 60
            max_y_axis: 120
  - type: grid
    cards:
      - type: heading
        heading_style: title
        heading: Mini-Split Downstairs
      - type: heading
        heading_style: subtitle
        heading: Controls
      - type: grid
        square: false
        columns: 2
        cards:
          - type: tile
            entity: switch.basement_rec_rovsun_mini_split_downstairs_power
