              type: entity
            vertical: false
            features_position: bottom
          - type: tile
            entity: switch.office_rovsun_mini_split_downstairs_beep
            name:
              type: entity
            vertical: false
            features_position: bottom
          - type: tile
            entity: switch.office_rovsun_mini_split_downstairs_light
            name:
              type: entity
            vertical: false
            features_position: bottom
          - type: tile
            entity: select.basement_rec_rovsun_mini_split_downstairs_fan
            name:
              type: entity
            vertical: false
            features_position: inline
            features:
              - type: select-options
          - type: tile
            entity: select.office_rovsun_mini_split_downstairs_left_right_direction
            name:
              type: entity
            vertical: false
            features_position: inline
            features:
              - type: select-options
          - type: tile
            entity: select.office_rovsun_mini_split_downstairs_vertical_direction
            name:
              type: entity
            vertical: false
            features_position: inline
            features:
              - type: select-options
          - type: tile
            entity: switch.office_rovsun_mini_split_downstairs_eco
            name:
              type: entity
            vertical: false
          - type: tile
            entity: select.office_rovsun_mini_split_downstairs_generator_mode
            name:
              type: entity
            vertical: false
            features_position: inline
            features:
              - type: select-options
          - type: tile
            entity: switch.office_rovsun_mini_split_downstairs_drying
            name:
              type: entity
            vertical: false
            features_position: bottom
          - type: tile
            entity: select.office_rovsun_mini_split_downstairs_sleep_mode
            name:
              type: entity
            vertical: false
            features_position: inline
            features:
              - type: select-options
      - type: heading
        heading_style: subtitle
        heading: Temp Change
      - type: vertical-stack
        cards:
          - type: grid
            square: false
            columns: 2
            cards:
              - type: tile
                entity: button.basement_rec_rovsun_mini_split_downstairs_temp_2
                name: Temp Decrease -
                icon: mdi:thermometer-minus
                vertical: false
                features_position: bottom
              - type: tile
                entity: button.basement_rec_rovsun_mini_split_downstairs_temp
                name: Temp Increase +
                icon: mdi:thermometer-plus
                vertical: false
                features_position: bottom
              - type: tile
                entity: >-
                  number.basement_rec_rovsun_mini_split_downstairs_target_temperature
                name:
                  type: entity
                vertical: false
                features_position: bottom
              - type: tile
                entity: select.basement_rec_rovsun_mini_split_downstairs_mode
                name:
                  type: entity
                vertical: false
                features_position: inline
                features:
                  - type: select-options
          - type: statistics-graph
            entities:
              - >-
                sensor.basement_rec_rovsun_mini_split_downstairs_current_temperature
            title: Current Temp
            days_to_show: 1
            period: 5minute
            chart_type: line-stack
